[project]
name = "orchestrator-sidecar"
version = "0.1.0"
description = "claude-agent-sdk sidecar for the Supacode orchestrator fork"
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk>=0.1.0",
  "aiohttp>=3.9",
  "anyio>=4.3",
]

[tool.uv]
dev-dependencies = [
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]
